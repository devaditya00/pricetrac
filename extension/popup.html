<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PriceTrac</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #ffffff;
    }

    .header {
      padding: 16px;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 16px;
      font-weight: 700;
      color: #111;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
    }

    .status-dot.offline {
      background: #ef4444;
    }

    .content {
      padding: 16px;
    }

    .platform-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #f0f9ff;
      color: #0369a1;
      font-size: 12px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 12px;
    }

    .product-name {
      font-size: 13px;
      color: #374151;
      line-height: 1.5;
      margin-bottom: 16px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .track-btn {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .track-btn:hover {
      background: #1d4ed8;
    }

    .track-btn:disabled {
      background: #93c5fd;
      cursor: not-allowed;
    }

    .track-btn.success {
      background: #16a34a;
    }

    .track-btn.error {
      background: #dc2626;
    }

    .not-supported {
      text-align: center;
      padding: 24px 16px;
      color: #6b7280;
      font-size: 13px;
    }

    .not-supported p:first-child {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .login-section {
      padding: 16px;
    }

    .login-section p {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 12px;
      text-align: center;
    }

    .input {
      width: 100%;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      margin-bottom: 8px;
      outline: none;
    }

    .input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1);
    }

    .login-btn {
      width: 100%;
      background: #111;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 9px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .error-text {
      color: #dc2626;
      font-size: 12px;
      margin-top: 6px;
      text-align: center;
    }

    .footer {
      padding: 10px 16px;
      border-top: 1px solid #f0f0f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer a {
      font-size: 11px;
      color: #9ca3af;
      text-decoration: none;
    }

    .footer a:hover {
      color: #2563eb;
    }

    .logout-btn {
      font-size: 11px;
      color: #9ca3af;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
    }

    .logout-btn:hover {
      color: #ef4444;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">PriceTrac</span>
    <div class="status-dot" id="statusDot"></div>
  </div>

  <div id="loginSection" class="login-section" style="display:none">
    <p>Log in to track prices</p>
    <input type="email" id="emailInput" class="input" placeholder="Email" />
    <input type="password" id="passwordInput" class="input" placeholder="Password" />
    <button class="login-btn" id="loginBtn">Log in</button>
    <p class="error-text" id="loginError"></p>
  </div>

  <div id="mainSection" style="display:none">
    <div class="content">
      <div id="supportedContent" style="display:none">
        <div class="platform-badge" id="platformBadge">Amazon</div>
        <p class="product-name" id="productName">Detecting product...</p>
        <button class="track-btn" id="trackBtn">Track This Product</button>
      </div>

      <div id="notSupported" class="not-supported" style="display:none">
        <p>🛍️</p>
        <p>Visit an Amazon, Flipkart or Myntra product page to track it</p>
      </div>
    </div>

    <div class="footer">
      <a href="https://pricetrac.vercel.app/dashboard" target="_blank">
        Open Dashboard
      </a>
      <button class="logout-btn" id="logoutBtn">Log out</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
